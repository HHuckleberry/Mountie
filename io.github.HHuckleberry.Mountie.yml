app-id: io.github.HHuckleberry.Mountie
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '5.15-25.08'
command: mountie

# Applies to every module's build. Modules install Python packages into
# /app via "pip3 install --prefix=${FLATPAK_DEST}", but that alone doesn't
# make them importable during the build: the build's python3 is the SDK's
# own interpreter (verified: org.kde.Sdk//5.15-25.08 ships Python 3.13.11,
# with setuptools 80.9.0 already importable system-wide, well past the
# problem version), and it only searches /app's site-packages if told to.
# Without this, the setuptools module below installs successfully but is
# never actually seen, and every later module silently falls back to the
# SDK's own too-new setuptools - which is exactly what happened before this
# was added: the pin looked like it should have worked and didn't.
build-options:
  env:
    PYTHONPATH: /app/lib/python3.13/site-packages
    # PyQt.BaseApp inherits QtWebEngine, but Mountie does not import it.
    # Its supplied cleanup script checks this switch before removing the
    # WebEngine/PDF libraries and their large Chromium data files.
    BASEAPP_REMOVE_WEBENGINE: '1'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

# PyQt.BaseApp is intentionally broad. Mountie uses QtCore/QtGui/QtWidgets,
# not WebEngine or the packaging toolchain bundled for applications that
# build extra PyQt modules. Removing these app-local files does not affect the
# shared KDE runtime and cuts hundreds of uncompressed megabytes.
cleanup:
  - /lib/*/libQt5WebEngine*.so*
  - /libexec/QtWebEngineProcess
  - /resources
  - /lib/debug
  - /lib/python*/site-packages/PyQt5/QtWebEngine*.so
  - /lib/python*/site-packages/PyQt5/QtWebChannel*.so
  - /lib/python*/site-packages/pyqtbuild
  - /lib/python*/site-packages/sipbuild
  - /lib/python*/site-packages/PyQt5_sip-*.dist-info
  - /lib/python*/site-packages/PyQt5-*.dist-info
  - /lib/python*/site-packages/setuptools*
  - /lib/python*/site-packages/pkg_resources
  - /lib/python*/site-packages/wheel*
  - /lib/python*/site-packages/mesonpy
  - /lib/python*/site-packages/meson_python-*.dist-info
  - /lib/python*/site-packages/pyproject_metadata*

finish-args:
  - --env=GIO_EXTRA_MODULES=/app/lib64/gio/modules
  # Windowing + theming. --socket=wayland covers COSMIC/Wayland; the X11
  # fallback and --share=ipc are still needed for XWayland apps and for Qt's
  # own IPC (shared memory segments for rendering).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Settings -> General's "Automatically check for updates on startup" is
  # the only thing that uses this: an HTTPS GET of GitHub's releases API on
  # launch to compare the latest tag against the running version, nothing
  # more. It only ever reads github.com and never sends anything; the
  # sandbox permission model can't scope network access to a single host,
  # so this is all-or-nothing. Users who'd rather Mountie make no network
  # calls at all can turn the setting off.
  - --share=network
  # No portal exists for GVfs mounts or libsecret, so both need explicit
  # access. This is the main thing a Flathub reviewer will question - static
  # permissions are supposed to be minimal, but there's no portal covering
  # "mount a network share" (unlike open/save, which go through the file
  # chooser portal instead of --filesystem).
  - --talk-name=org.gtk.vfs.*
  - --talk-name=org.gtk.vfs.UDisks2VolumeMonitor
  - --filesystem=xdg-run/gvfs
  # GVfs prefers its private peer socket and otherwise emits a warning before
  # falling back to the session bus for every operation.
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.login1
  # Native (opt-in, per-share) kernel CIFS mounts require running a
  # root-owned helper on the host via pkexec; there is no portal for this
  # and the sandbox cannot invoke privileged host commands directly, so
  # flatpak-spawn --host is the only path to the host's pkexec. The
  # one-time host setup that installs the pkexec policy and helper itself
  # is scripts/install-native-mount-helper.sh, run manually with sudo.
  - --talk-name=org.freedesktop.Flatpak
  # The mountpoint directory and the transient credentials file the native
  # backend creates both live under /run/user/<uid>/mountie. The host-side
  # helper above validates and mounts onto that exact host path, so the
  # sandboxed process needs to see the real host directory here too, not
  # its own private runtime-dir view - same reasoning as xdg-run/gvfs above.
  - --filesystem=xdg-run/mountie
  # Read-only access lets the first Flatpak run migrate shares from a prior
  # native installation. New writes use Flatpak's persistent XDG config dir.
  - --filesystem=~/.config/mountie:ro
  # The settings portal (org.freedesktop.portal.Settings, used for
  # light/dark + accent color) and org.freedesktop.portal.Desktop generally
  # need no finish-args entry - portal access is always allowed.

# Settings -> Diagnostics -> "View Software Bill of Materials" reads
# mountie/data/sbom.json, a static snapshot of this module list generated by
# scripts/generate_sbom.py. Re-run that script and commit the result after
# adding, removing, or re-pinning any module below, or after changing
# runtime/runtime-version/base/base-version - tests/test_sbom.py fails the
# build if the checked-in file drifts from this manifest.
modules:
  # setuptools has to go first and be pinned below 74. gobject-introspection
  # 1.80.1's g-ir-scanner unconditionally does
  # "from distutils.msvccompiler import MSVCCompiler" - real stdlib distutils
  # is gone as of Python 3.12, so that import is only satisfied by
  # setuptools' own vendored copy, and setuptools removed msvccompiler from
  # that vendored copy at 74. Whatever setuptools org.kde.Sdk's python3
  # ships is >=74, so this fails without the pin. (A newer
  # gobject-introspection release may fix this upstream and let this module
  # be dropped - not verified here.) This also satisfies the mountie
  # module's own setuptools>=61 requirement below, so one pin covers both.
  #
  # Two more things had to be true before this actually worked, both found
  # by reproducing the exact build command outside flatpak-builder via
  # `flatpak run --command=... org.kde.Sdk//5.15-25.08`, rather than
  # guessing again after two failed attempts:
  #
  #  1. Unpinned "setuptools" as the install target is a no-op: pip checks
  #     whether the requirement is already satisfied by anything visible on
  #     sys.path BEFORE it looks in --find-links, and 80.9.0 always is
  #     visible (it's what the SDK's own python3 ships). Confirmed directly
  #     - it printed "Requirement already satisfied: setuptools ... (80.9.0)"
  #     and installed nothing, no error, silently. Needed an exact pin,
  #     "setuptools==69.5.1", plus --force-reinstall --ignore-installed so
  #     pip doesn't just re-confirm 80.9.0 satisfies "some setuptools".
  #
  #  2. With that fixed, installing the sdist tarball failed differently:
  #     building it from source invokes setuptools' own PEP 517 build
  #     backend, which needs the "wheel" package - unavailable with
  #     --no-index. Switched the source to setuptools' prebuilt wheel
  #     instead, which pip can install directly with no build step, sidestepping
  #     the problem rather than solving it.
  - name: setuptools
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=. --prefix=${FLATPAK_DEST}
          --force-reinstall --ignore-installed "setuptools==69.5.1"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f7/29/13965af254e3373bceae8fb9a0e6ea0d0e571171b80d6646932131d6439b/setuptools-69.5.1-py3-none-any.whl
        sha256: c636ac361bc47580504644275c9ad802c50415c7522212252c033bd15f301f32

  # Modern setuptools doesn't bundle the ability to build a wheel itself -
  # "bdist_wheel" is registered by the separate wheel package. Without it,
  # setuptools.build_meta gets through metadata generation fine and then
  # fails with "error: invalid command 'bdist_wheel'". Found and fixed by
  # building a throwaway pyproject.toml package with the identical
  # [build-system] setuptools>=61.0 shape mountie itself uses, offline,
  # against this exact SDK - not inferred.
  - name: wheel
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links=. --prefix=${FLATPAK_DEST}
          --force-reinstall --ignore-installed "wheel==0.43.0"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/7d/cd/d7460c9a869b16c3dd4e1e403cce337df165368c71d6af229a74699622ce/wheel-0.43.0-py3-none-any.whl
        sha256: 55c570405f142630c6b9f72fe09d9b67cf1477fcf543ae5b8dcb1f5b7377da81

  # --- PyGObject + the GLib/Gio/Secret bindings ---
  # The KDE runtime has Qt but not PyGObject; the GNOME runtime has PyGObject
  # but not Qt. This app needs both, so PyGObject is built as a module here.
  # (Its cairo/GTK integration is explicitly disabled below, in the
  # python3-pygobject module - Mountie doesn't use it.)
  - name: gobject-introspection
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gobject-introspection/1.80/gobject-introspection-1.80.1.tar.xz
        sha256: a1df7c424e15bda1ab639c00e9051b9adf5cea1a9e512f8a603b53cd199bc6d8

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
      - -Dvapi=false
      - -Dmanpage=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.4.tar.xz
        sha256: 163d08d783be6d4ab9a979ceb5a4fecbc1d9660d3c34168c581301cd53912b20

  # The KDE runtime does not include GVfs's GIO client module. Without it,
  # Gio sees only its local VFS implementation and mount_enclosing_volume()
  # fails with "volume doesn't implement mount" before reaching the host's
  # GVfs daemon. Only the protocol-independent client libraries are retained;
  # the host session continues to provide and run the actual GVfs backends.
  - name: gvfs-client
    buildsystem: meson
    config-opts:
      - -Dsystemduserunitdir=no
      - -Dtmpfilesdir=no
      - -Dadmin=false
      - -Dafc=false
      - -Dafp=false
      - -Darchive=false
      - -Dburn=false
      - -Dcdda=false
      - -Ddnssd=false
      - -Dgoa=false
      - -Dgoogle=false
      - -Dgphoto2=false
      - -Dhttp=false
      - -Dmtp=false
      - -Dnfs=false
      - -Donedrive=false
      - -Dsftp=false
      - -Dsmb=false
      - -Dudisks2=false
      - -Dwsdd=false
      - -Dbluray=false
      - -Dfuse=false
      - -Dgcr=false
      - -Dgcrypt=false
      - -Dgudev=false
      - -Dkeyring=false
      - -Dlogind=false
      - -Dlibusb=false
      - -Ddeprecated_apis=false
      - -Dman=false
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /libexec
      - /share/dbus-1
      - /share/glib-2.0
      - /share/gvfs
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gvfs/1.54/gvfs-1.54.4.tar.xz
        sha256: 0893305c8ae375414907813a9e4c9435f6eb78bcc2ac6baaddb9391ba5c5b9ba

  # PyGObject ships no wheel, only an sdist, so it has to be built - and its
  # pyproject.toml build backend is meson-python, not setuptools. With
  # --no-index, pip's normal PEP 517 build isolation (an ephemeral venv it
  # tries to populate over the network) can't be used, so these two modules
  # install meson-python and its one missing dependency directly into
  # /app first, and the pygobject module below uses --no-build-isolation to
  # build against them instead.
  #
  # Checked directly in the SDK (flatpak run --command=python3
  # org.kde.Sdk//5.15-25.08) which of meson-python's own dependencies were
  # already there: mesonbuild and packaging both were; pyproject_metadata
  # and mesonpy were not. Only those two needed adding.
  #
  # Both installs need --no-deps: mesonbuild and packaging ARE importable in
  # the SDK (confirmed directly) but were installed by the distro's package
  # manager, not pip, so they carry no pip-recognizable install metadata.
  # Without --no-deps, pip's resolver doesn't credit them as satisfying
  # anything and tries to fetch its own copies, which fails offline -
  # reproduced this exact failure before adding the flag.
  - name: pyproject-metadata
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links=. --prefix=${FLATPAK_DEST}
          --force-reinstall --ignore-installed "pyproject-metadata==0.9.1"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/7e/b1/8e63033b259e0a4e40dd1ec4a9fee17718016845048b43a36ec67d62e6fe/pyproject_metadata-0.9.1-py3-none-any.whl
        sha256: ee5efde548c3ed9b75a354fc319d5afd25e9585fa918a34f62f904cc731973ad

  - name: meson-python
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links=. --prefix=${FLATPAK_DEST}
          --force-reinstall --ignore-installed "meson-python==0.18.0"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/28/58/66db620a8a7ccb32633de9f403fe49f1b63c68ca94e5c340ec5cceeb9821/meson_python-0.18.0-py3-none-any.whl
        sha256: 3b0fe051551cc238f5febb873247c0949cd60ded556efa130aa57021804868e2

  # pycairo (PyGObject's cairo/GTK-drawing integration) is unbuildable here -
  # confirmed missing from the SDK entirely, not just a metadata-recognition
  # gap like above - but Mountie only ever does
  # `from gi.repository import Gio, GLib, Secret`, never touches cairo or
  # GTK widgets, so it isn't needed. Checked PyGObject's own meson_options.txt
  # from its source tarball: pycairo is an explicit meson feature
  # (option('pycairo', type: 'feature', value: 'auto', ...)), so
  # -Dpycairo=disabled skips building that integration. --no-deps is then
  # required too: PyGObject's pyproject.toml declares "pycairo>=1.16"
  # unconditionally in [project.dependencies], regardless of the meson
  # option, so without --no-deps pip would still try to resolve it after a
  # successful build and fail the same way as the meson-python deps above.
  #
  # This module is inferred from PyGObject's own build configuration, not
  # build-tested end-to-end here (the full build needs headers this
  # environment doesn't have) - unlike the setuptools and meson-python
  # fixes above, which were both verified directly before being written
  # here.
  - name: python3-pygobject
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --no-deps --find-links=.
          --config-settings=setup-args=-Dpycairo=disabled
          --prefix=${FLATPAK_DEST} --force-reinstall --ignore-installed
          "pygobject==3.56.3"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/da/61/978c5fbca34f10a90df362502fbb5a005637909e7b5a0e9212349ea9d010/pygobject-3.56.3.tar.gz
        sha256: 12760e4a0e3d04b6eb95e06f7a27e362c826d567ea613373a92c003b6c70d2d6

  # --- Mountie itself ---
  - name: mountie
    buildsystem: simple
    build-commands:
      # --no-build-isolation is required, not optional: without it pip
      # creates an isolated build environment that ignores PYTHONPATH
      # entirely (by design, so a build isn't contaminated by whatever's
      # ambient) and tries to fetch setuptools>=61.0 fresh, which fails
      # offline exactly like the earlier gobject-introspection/pygobject
      # failures did. Confirmed directly, including that plain
      # --no-build-isolation alone isn't enough either: metadata generation
      # then failed with "invalid command 'bdist_wheel'" until the wheel
      # module above was also added, since setuptools doesn't bundle that
      # command itself.
      - pip3 install --no-index --no-build-isolation --no-deps --find-links=.
          --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/io.github.HHuckleberry.Mountie.desktop
          ${FLATPAK_DEST}/share/applications/io.github.HHuckleberry.Mountie.desktop
      - install -Dm644 data/io.github.HHuckleberry.Mountie.svg
          ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.HHuckleberry.Mountie.svg
      - install -Dm644 data/io.github.HHuckleberry.Mountie.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/io.github.HHuckleberry.Mountie.metainfo.xml
      # Bundled so Settings can offer native-mount setup without network
      # access: a Flatpak build has no access to the surrounding git repo on
      # the host, so this is the only copy of the installer a Flatpak-only
      # user has. mountie/native_mount.py's export_installer_for_host()
      # reads it from this exact path and writes it out to a host-visible
      # location the user can run with sudo.
      - install -Dm755 scripts/install-native-mount-helper.sh
          ${FLATPAK_DEST}/share/mountie/install-native-mount-helper.sh
    sources:
      # Pinned to a tag AND its commit, not just the tag - GitHub's
      # auto-generated tarball checksums have changed on GitHub's end before
      # (a compression change once invalidated sha256 hashes across many
      # Flathub manifests), but a commit-pinned git source can't drift.
      - type: git
        url: https://github.com/HHuckleberry/Mountie.git
        tag: v0.4.1
        commit: 40327753aa9baf7e7b06abf4bbba91fdad6f2828
